<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Inventory Management System - User Login</title>
    <!-- 1. Import Bootstrap (Responsive Layout Foundation) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 2. Import Custom Style File (Same Directory as HTML) -->
    <link rel="stylesheet" href="style.css">
    <!-- 3. Import Bootstrap Icons (For Password Show/Hide Function) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <!-- Theme Switcher -->
    <input type="radio" name="erp-theme" id="erp-default" checked>
    <input type="radio" name="erp-theme" id="erp-modern">
    <input type="radio" name="erp-theme" id="erp-dark">

    <div class="theme-switcher">
        <label for="erp-default">Corporate</label>
        <label for="erp-modern">Modern</label>
        <label for="erp-dark">Dark</label>
    </div>
    <div class="container">
        <!-- Login Form Container (Using .auth-container from style.css) -->
        <div class="auth-container">
            <h2 class="erp-title">ERP Inventory Management System</h2>
            <h5 class="text-center text-muted mb-4">User Login</h5>

            <!-- Login Form -->
            <form id="loginForm">
                <!-- Username/Email Input -->
                <div class="mb-3">
                    <label for="loginAccount" class="form-label">Username/Email</label>
                    <input type="text" class="form-control" id="loginAccount"
                        placeholder="Please enter username or registered email" required>
                </div>

                <!-- Password Input (With Show/Hide Function) -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="loginPassword" class="form-label">Password</label>
                        <a href="#" class="auth-link fs-6">Forgot Password?</a>
                    </div>
                    <div class="input-group">
                        <input type="password" class="form-control" id="loginPassword"
                            placeholder="Please enter password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePwd">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <!-- Login Button (Using .btn-erp from style.css) -->
                <button type="submit" class="btn btn-erp w-100 py-2">Login</button>

                <!-- Registration Link (Using .auth-link from style.css) -->
                <div class="text-center mt-3">
                    Don't have an account? <a href="register.html" class="auth-link fw-medium">Sign Up Now</a>
                </div>

                <!-- Security Hint (Using .security-hint from style.css) -->
                <div class="security-hint">
                    Note: The system uses encrypted session authentication, please do not save login status on public
                    devices.
                </div>
            </form>
        </div>
    </div>

    <!-- Import Bootstrap JS (Interaction Foundation) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Password Show/Hide Toggle Logic
        const togglePwd = document.getElementById('togglePwd');
        const loginPassword = document.getElementById('loginPassword');
        togglePwd.addEventListener('click', () => {
            const type = loginPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            loginPassword.setAttribute('type', type);
            togglePwd.innerHTML = type === 'password' ?
                '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });

        // Form Submission Basic Validation (Can be connected to backend API later)
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const account = document.getElementById('loginAccount').value;
            const password = loginPassword.value;
            alert(`Account: ${account}\nPassword: ${password}\n(Actual scenario needs to be replaced with backend API request for secure authentication)`);
        });
    </script>
</body>

</html>
